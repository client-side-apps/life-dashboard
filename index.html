<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script type="importmap">
    {
        "imports": {
            "leaflet": "https://esm.sh/leaflet@1.9.4",
            "chart.js": "https://esm.sh/chart.js@4.4.1/auto",
            "jszip": "https://esm.sh/jszip@3.10.1"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</head>

<body>
    <a href="#app-content" class="skip-link">Skip to content</a>
    <header class="app-header">
        <div class="header-left">
            <h1>Life Dashboard</h1>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="#/map" class="nav-btn active">Map</a>
            <a href="#/timeline" class="nav-btn">Timeline</a>
            <a href="#/health" class="nav-btn">Health</a>
            <a href="#/finance" class="nav-btn">Finance</a>
            <a href="#/energy" class="nav-btn">Energy</a>
            <a href="#/data" class="nav-btn">Data</a>
        </nav>
        <div class="header-right">
            <date-range-picker id="global-date-picker"></date-range-picker>
            <div id="db-status" class="status-indicator" role="status" aria-live="polite"></div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                <svg class="icon-sun" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor"
                        d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
                </svg>
                <svg class="icon-moon hidden" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor"
                        d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
                </svg>
            </button>
        </div>
    </header>

    <main id="app-content">
        <!-- Views will be injected here -->
        <div id="view-container" class="view-container">
            <div class="placeholder-message">
                <h2>Welcome to Life Dashboard</h2>
                <p>Please select a database file to get started.</p>
                <input type="file" id="start-db-input" accept=".sqlite,.db,.sqlite3" class="file-input">
                <div class="welcome-actions">
                    <button id="load-demo-btn" class="secondary-btn">Load Demo Database</button>
                </div>
            </div>
        </div>
    </main>

    <!-- View Templates -->
    <template id="map-view-template">
        <div class="loading-overlay hidden" role="status" aria-live="polite">Loading...</div>
        <div class="map-overlay">

            <!-- Global date picker used -->
            <div id="map-stats" class="map-stats"></div>
        </div>
        <div id="leaflet-map" class="full-map" role="application" aria-label="Location map"></div>
    </template>

    <template id="timeline-view-template">
        <div class="loading-overlay hidden" role="status" aria-live="polite">Loading...</div>
        <div class="timeline-controls">

            <!-- Global date picker used -->
            <span id="timeline-stats"></span>
        </div>
        <div id="timeline-content" class="timeline-content">
            <p>Select a table with a timestamp column.</p>
        </div>
    </template>

    <template id="health-view-template">
        <div class="loading-overlay hidden" role="status" aria-live="polite">Loading...</div>
        <div class="health-nav">
            <a href="#" class="secondary-btn active" data-subview="dashboard">Dashboard</a>
            <a href="#" class="secondary-btn" data-subview="heart">Heart</a>
            <a href="#" class="secondary-btn" data-subview="activity">Activity</a>
            <a href="#" class="secondary-btn" data-subview="body">Body</a>
            <a href="#" class="secondary-btn" data-subview="sleep">Sleep</a>
            <a href="#" class="secondary-btn" data-subview="biomarkers">Biomarkers</a>
            <a href="#" class="secondary-btn" data-subview="vaccines">Vaccines</a>
            <a href="#" class="secondary-btn" data-subview="nutrition">Nutrition</a>
        </div>
        <!-- Global date picker used -->
        <div id="health-content" class="health-content">
            <!-- Charts will go here -->
        </div>
    </template>

    <template id="finance-view-template">
        <div class="loading-overlay hidden" role="status" aria-live="polite">Loading...</div>
        <div class="finance-dashboard">
            <div class="card">
                <h3>Total Available</h3>
                <p class="amount primary" id="total-money">Loading...</p>
            </div>
            <div class="card">
                <h3>Retirement</h3>
                <p class="amount secondary" id="retirement-money">Loading...</p>
            </div>
            <div class="card">
                <h3>To Sell</h3>
                <p class="amount accent" id="sell-money">Loading...</p>
            </div>
        </div>

        <div class="finance-controls">
            <label for="finance-account-select" class="sr-only">Account</label>
            <select id="finance-account-select" class="select-input finance-account-select" aria-label="Filter by account">
                <option value="">All Accounts</option>
            </select>
            <!-- Global date picker used -->
        </div>

        <div class="transaction-list">
            <table class="data-table">
                <thead>
                    <tr>
                        <th scope="col" width="20%">Date</th>
                        <th scope="col" width="60%">Description</th>
                        <th scope="col" width="20%" class="align-right">Amount</th>
                    </tr>
                </thead>
                <tbody id="transaction-body">
                </tbody>
            </table>
        </div>
    </template>

    <template id="energy-view-template">
        <div id="energy-loading" class="loading-overlay hidden" role="status" aria-live="polite">Loading...</div>
        <!-- Global date picker used -->
        <div class="charts-grid">
            <chart-card title="Electricity: Solar vs Consumption" chart-id="solar-chart"></chart-card>
            <chart-card title="Electricity Import" chart-id="elec-import-chart"></chart-card>
            <chart-card title="Gas Import" chart-id="gas-chart"></chart-card>
            <chart-card title="Water Usage" chart-id="water-chart"></chart-card>
        </div>
    </template>



    <template id="raw-data-view-template">
        <div class="loading-overlay hidden" role="status" aria-live="polite">Loading...</div>
        
        <div class="data-view-layout">
            <section class="data-section">
                <h3>Database</h3>
                <div class="section-controls">
                    <button id="open-db-btn" class="secondary-btn">Open Database</button>
                    <button id="load-demo-btn" class="secondary-btn">Load Demo Database</button>
                    <button id="download-db-btn" class="secondary-btn">Download Database</button>
                    <input type="file" id="start-db-input" class="file-input" accept=".sqlite,.db,.sqlite3" style="display: none;">
                </div>
            </section>

            <section class="data-section">
                <h3>Import Data</h3>
                <div id="import-view-container"></div>
            </section>

            <section class="data-section">
                <h3>Explore Data</h3>
                <div class="data-controls">
                    <label for="data-table-select" class="sr-only">Data table</label>
                    <select id="data-table-select" class="select-input data-table-select" aria-label="Select data table">
                        <option value="" disabled selected>Select Table</option>
                    </select>
                    <!-- Global date picker used -->
                    <span id="data-count" class="data-count-label"></span>
                </div>
                <div class="table-wrapper">
                    <table id="data-table" class="generic-table">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </div>
    </template>

    <template id="import-view-template">
        <div class="import-card">
            <h2>Import Data</h2>

            <div class="form-group">
                <label class="form-label" for="import-file">Select File</label>
                <input type="file" id="import-file" class="file-input full-width" accept=".csv,.json,.zip">
            </div>

            <div class="form-group">
                <label class="form-label" for="import-type">Data Type</label>
                <select id="import-type" class="select-input full-width">
                    <option value="generic">Generic CSV/JSON</option>
                    <option value="location">Location History</option>
                    <option value="finance">Bank Statement</option>
                    <option value="health">Health Export</option>
                </select>
            </div>

            <button id="do-import-btn" class="primary-btn full-width">Import</button>
        </div>
    </template>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content" role="dialog" aria-modal="true" aria-label="Dialog">
            <button class="close-modal" aria-label="Close dialog">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

</body>

</html>
